version: 2
kind: cursor-agent
icon: "↗"
home:
  env: ""
  default: {base: provided_parent, path: .cursor}
discovery:
  process: cursor-agent
  aliases: [agent]
  exclude_subcommands: ["--help", "-h", "--version", "login", "logout", "status", "update", "install-shell-integration", "mcp", "create-chat"]
transcript:
  roots:
    - {path: projects, depth: 3, archived: false}
  messages:
    user:
      sources:
        - when: {/role: user}
          path: /message/content
          shape: blocks
          types: [text]
    assistant:
      sources:
        - when: {/role: assistant}
          path: /message/content
          shape: blocks
          types: [text]
operations:
  launch:
    identity: client_pid
    skip_permissions: [--force]
    prompt: [--, "{prompt}"]
    model: --model
    probe:
      args: [--help]
      contains: [--help]
      error: "cursor-agent does not support the required native command"
      description: "cursor-agent: terminal launch; external sessions remain in their own terminals"
  resume:
    args: [--resume, "{id}"]
  message:
    unavailable: "it takes prompts at launch or headless with --print; nothing addresses a running interactive session"
execution:
  enforcement: unsupported
  result: unsupported
viewer:
  input:
    return_to_list:
      - {key: ctrl+z, when: always}
