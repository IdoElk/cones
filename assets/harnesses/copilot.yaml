version: 2
kind: copilot
icon: "◉"
home:
  env: ""
  default: {base: provided_parent, path: .copilot}
discovery:
  process: copilot
  exclude_subcommands: ["--help", "-h", "--version", "login", "logout", "help", "version", "update"]
transcript:
  roots:
    - {path: session-state, depth: 1, archived: false}
  messages:
    user:
      id: /id
      sources:
        - when: {/type: user.message}
          path: /data/content
          shape: string
    assistant:
      id: /data/messageId
      sources:
        - when: {/type: assistant.message}
          path: /data/content
          shape: string
operations:
  launch:
    identity: client_pid
    skip_permissions: [--allow-all]
    prompt: [--, "{prompt}"]
    prompt_flag: --interactive
    model: --model
    probe:
      args: [--help]
      contains: [--interactive]
      error: "copilot does not support the required native command"
      description: "copilot: terminal launch; external sessions remain in their own terminals"
execution:
  enforcement: unsupported
  result: unsupported
viewer:
  input:
    return_to_list:
      - {key: ctrl+z, when: always}
